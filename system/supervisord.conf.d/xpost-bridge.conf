# Runs one instance of the Slack<->Discord crosspost bridge (the xpost-bridge
# repo, checked out at .external_worktrees/xpost-bridge). Secrets come from
# the two with_secrets wrappers below; everything else is the environment
# line. Every REPLACE_WITH_* value in that line must be filled in with your
# own ids before starting this program -- see docs/SETUP.md and
# docs/OPERATIONS.md in github.com/imbue-ai/xpost-bridge for what each
# variable means and how to obtain the channel/operator ids.
[program:xpost-bridge]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user python3 system/scripts/with_secrets.py data/.secrets/slack-xpost.env -- python3 system/scripts/with_secrets.py data/.secrets/discord-xpost.env -- .external_worktrees/xpost-bridge/node_modules/.bin/tsx .external_worktrees/xpost-bridge/src/index.ts
directory=/home/user/workspace
environment=XPOST_OPERATOR_ID="REPLACE_WITH_4_CHAR_OPERATOR_ID",XPOST_SLACK_CHANNEL_ID="REPLACE_WITH_YOUR_SLACK_CHANNEL_ID",XPOST_DISCORD_CHANNEL_IDS="REPLACE_WITH_DISCORD_CHANNEL_ID:general,REPLACE_WITH_DISCORD_CHANNEL_ID:show-and-tell",XPOST_DISCORD_FORUM_ID="REPLACE_WITH_DISCORD_FORUM_ID",XPOST_DISCORD_FORUM_NAME="help-and-bugs",XPOST_DIRECTION="both",XPOST_SINGLE_INSTANCE="1",XPOST_MIRROR_REACTIONS="0",XPOST_TIME_SOURCE="sntp",XPOST_LOG_LEVEL="info",XPOST_CATCH_UP="1",XPOST_DATA_DIR="data/.apps/xpost-bridge",XPOST_RAW_LOG_DIR="data/.apps/xpost-bridge/raw",XPOST_STATUS_FILE="data/.apps/xpost-dashboard/status.json",XPOST_ALERT_CHANNEL_ID="REPLACE_WITH_A_PRIVATE_SLACK_CHANNEL_ID",XPOST_ADMIN_PORT="8093"
autostart=true
autorestart=true
startsecs=30
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xpost-bridge-stdout.log
stderr_logfile=/var/log/supervisor/xpost-bridge-stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=3
