[project]
name = "xpost-dashboard"
version = "0.1.0"
description = "Monitoring and control plane for the Slack/Discord crosspost bridges"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
xpost-dashboard = "xpost_dashboard.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xpost_dashboard"]
