<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Slack-Discord bridge">
  <rect width="240" height="160" rx="12" fill="#1c2430"/>

  <!-- ground -->
  <line x1="16" y1="140" x2="224" y2="140" stroke="#394552" stroke-width="2"/>

  <!-- bridge arch connecting the two platforms -->
  <path d="M46 140 Q120 76 194 140" fill="none" stroke="#8a97a3" stroke-width="6" stroke-linecap="round"/>
  <path d="M46 140 Q120 76 194 140" fill="none" stroke="#c4ccd4" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- pier supports -->
  <line x1="46" y1="140" x2="46" y2="150" stroke="#8a97a3" stroke-width="6" stroke-linecap="round"/>
  <line x1="194" y1="140" x2="194" y2="150" stroke="#8a97a3" stroke-width="6" stroke-linecap="round"/>

  <!-- messages traveling both directions across the bridge -->
  <circle cx="90" cy="98" r="5" fill="#1fa2a6"/>
  <circle cx="150" cy="98" r="5" fill="#e8734a"/>

  <!-- left platform's speech bubble -->
  <rect x="14" y="26" width="72" height="44" rx="14" fill="#1fa2a6"/>
  <path d="M30 70 L26 88 L48 70 Z" fill="#1fa2a6"/>
  <rect x="28" y="38" width="42" height="7" rx="3.5" fill="#eafbfa"/>
  <rect x="28" y="50" width="28" height="7" rx="3.5" fill="#eafbfa" opacity="0.7"/>

  <!-- right platform's speech bubble -->
  <rect x="154" y="26" width="72" height="44" rx="14" fill="#e8734a"/>
  <path d="M210 70 L214 88 L192 70 Z" fill="#e8734a"/>
  <rect x="168" y="38" width="42" height="7" rx="3.5" fill="#fff1ea"/>
  <rect x="168" y="50" width="28" height="7" rx="3.5" fill="#fff1ea" opacity="0.7"/>
</svg>
